# Canary-only Harness policy. It keeps the production agent/tool topology but
# lowers the routed model capacity so deterministic provider usage crosses the
# native compaction threshold without changing production behavior.

- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: true

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    thinking: enabled
    reasoningEffort: high
    streamIdleTimeoutMs: 300000
    models:
      - id: deepseek-v4-flash
        name: DeepSeek-V4-Flash Compaction Canary
        contextWindow: 20000
        maxTokens: 4096

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    persona: !!js process.env.DSH_SYSTEM_PROMPT ?? 'You are a careful software engineering agent. Use the Builder tools to inspect and update the project. Match user-facing progress and the final summary to the language of the original end-user request; use Simplified Chinese when that request is Chinese. Finish the requested change, then summarize what changed.'
    workspaceContext: false
    skills:
      enabled: false
    toolBash: false
    toolJobs: false
    goals: false
    maxParallelToolCalls: 4

- id: user-questions
  name: '@deepseek-ai/dsh-user-questions'

- id: builder-tool-broker
  name: './builder-tool-broker-plugin.mjs'

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT
    compression: none

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: tool-result-pruner
  name: '@deepseek-ai/dsh-compaction-tool-result-pruner'

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.9
    retainTokens: 1
    maxTokens: 512
    compactionRetries: 1
